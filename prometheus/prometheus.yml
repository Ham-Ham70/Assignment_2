global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: secret-identity
    static_configs:
      - targets: ["app:8000"]

  - job_name: secret-identity-grpc
    static_configs:
      - targets: ["app:9091"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          machine: "docker-desktop-linux-vm"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
